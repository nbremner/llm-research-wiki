<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 348" role="img" aria-labelledby="waTitle waDesc">
  <title id="waTitle">How the research wiki runs itself</title>
  <desc id="waDesc">Pipeline: Discover, Acquire, Triage, Synthesize, The wiki, Publish. A report-only Maintain stage audits the wiki inside a flywheel loop that feeds the wiki's open questions back into discovery.</desc>

  <rect x="0" y="0" width="1080" height="348" rx="10" fill="#141715"/>

  <!-- legend -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" letter-spacing="0.8">
    <rect x="118" y="28" width="42" height="17" rx="3" fill="#21322C" stroke="#82BCA7"/>
    <text x="139" y="40" text-anchor="middle" fill="#82BCA7">CODE</text>
    <rect x="392" y="28" width="50" height="17" rx="3" fill="#272A3E" stroke="#A3A7DC"/>
    <text x="417" y="40" text-anchor="middle" fill="#A3A7DC">AGENT</text>
    <rect x="690" y="28" width="50" height="17" rx="3" fill="#372C1B" stroke="#D8A65C"/>
    <text x="715" y="40" text-anchor="middle" fill="#D8A65C">OWNER</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#9AA093">
    <text x="170" y="41">deterministic — selects &amp; moves</text>
    <text x="450" y="41">LLM — judges, never self-approves</text>
    <text x="748" y="41">human — the only gate to canon</text>
  </g>

  <!-- stage cards -->
  <g>
    <rect x="16"  y="70" width="157" height="132" rx="6" fill="#1C201D" stroke="#31362F"/>
    <rect x="194" y="70" width="157" height="132" rx="6" fill="#1C201D" stroke="#31362F"/>
    <rect x="372" y="70" width="157" height="132" rx="6" fill="#1C201D" stroke="#31362F"/>
    <rect x="550" y="70" width="157" height="132" rx="6" fill="#1C201D" stroke="#31362F"/>
    <rect x="728" y="70" width="157" height="132" rx="6" fill="#21322C" stroke="#82BCA7"/>
    <rect x="906" y="70" width="157" height="132" rx="6" fill="#1C201D" stroke="#31362F"/>
  </g>

  <!-- flow arrows -->
  <g stroke="#82BCA7" stroke-width="1.6">
    <line x1="176" y1="136" x2="186" y2="136"/>
    <line x1="354" y1="136" x2="364" y2="136"/>
    <line x1="532" y1="136" x2="542" y2="136"/>
    <line x1="710" y1="136" x2="720" y2="136"/>
    <line x1="888" y1="136" x2="898" y2="136"/>
  </g>
  <g fill="#82BCA7">
    <polygon points="186,132 186,140 192,136"/>
    <polygon points="364,132 364,140 370,136"/>
    <polygon points="542,132 542,140 548,136"/>
    <polygon points="720,132 720,140 726,136"/>
    <polygon points="898,132 898,140 904,136"/>
  </g>

  <!-- titles -->
  <g font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="17" font-weight="600" fill="#E7E5DC">
    <text x="27"  y="97">Discover</text>
    <text x="205" y="97">Acquire</text>
    <text x="383" y="97">Triage</text>
    <text x="561" y="97">Synthesize</text>
    <text x="739" y="97">The wiki</text>
    <text x="917" y="97">Publish</text>
  </g>

  <!-- chips + cadences -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" letter-spacing="0.8">
    <rect x="27" y="104" width="42" height="17" rx="3" fill="#21322C" stroke="#82BCA7"/>
    <text x="48" y="116" text-anchor="middle" fill="#82BCA7">CODE</text>
    <text x="78" y="116" fill="#9AA093">DAILY</text>

    <rect x="205" y="104" width="42" height="17" rx="3" fill="#21322C" stroke="#82BCA7"/>
    <text x="226" y="116" text-anchor="middle" fill="#82BCA7">CODE</text>

    <rect x="383" y="104" width="50" height="17" rx="3" fill="#272A3E" stroke="#A3A7DC"/>
    <text x="408" y="116" text-anchor="middle" fill="#A3A7DC">AGENT</text>
    <text x="442" y="116" fill="#9AA093">DAILY</text>

    <rect x="561" y="104" width="50" height="17" rx="3" fill="#272A3E" stroke="#A3A7DC"/>
    <text x="586" y="116" text-anchor="middle" fill="#A3A7DC">AGENT</text>
    <rect x="617" y="104" width="50" height="17" rx="3" fill="#372C1B" stroke="#D8A65C"/>
    <text x="642" y="116" text-anchor="middle" fill="#D8A65C">OWNER</text>

    <text x="739" y="116" fill="#9AA093">MARKDOWN · GIT</text>

    <rect x="917" y="104" width="42" height="17" rx="3" fill="#21322C" stroke="#82BCA7"/>
    <text x="938" y="116" text-anchor="middle" fill="#82BCA7">CODE</text>
    <text x="967" y="116" fill="#9AA093">EVERY 6H</text>
  </g>

  <!-- body copy -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#9AA093">
    <text x="27" y="141">Scholarly APIs,</text>
    <text x="27" y="157">seeded by the wiki's</text>
    <text x="27" y="173">own open questions.</text>

    <text x="205" y="141">A fetch ladder lands</text>
    <text x="205" y="157">candidates in a</text>
    <text x="205" y="173">visible, auditable</text>
    <text x="205" y="189">inbox.</text>

    <text x="383" y="141">Rubric calls: wiki,</text>
    <text x="383" y="157">read-once, discard.</text>
    <text x="383" y="173">Ambiguity waits for</text>
    <text x="383" y="189">the owner.</text>

    <text x="561" y="141">Evidence auto-</text>
    <text x="561" y="157">commits; synthesis</text>
    <text x="561" y="173">needs an owner-</text>
    <text x="561" y="189">approved diff.</text>

    <text x="739" y="141">Cross-linked</text>
    <text x="739" y="157">markdown in git.</text>
    <text x="739" y="173">History is the</text>
    <text x="739" y="189">audit log.</text>

    <text x="917" y="141">The public site</text>
    <text x="917" y="157">rebuilds from</text>
    <text x="917" y="173">the repo.</text>
  </g>

  <!-- flywheel return path: wiki -> down -> left -> up into Discover -->
  <path d="M 807 206 L 807 312 Q 807 322 797 322 L 105 322 Q 95 322 95 312 L 95 214"
        fill="none" stroke="#82BCA7" stroke-width="2"/>
  <polygon points="88,215 102,215 95,203" fill="#82BCA7"/>

  <!-- maintain card (inside the flywheel) -->
  <rect x="261" y="214" width="380" height="88" rx="6" fill="#1C201D" stroke="#82BCA7" stroke-dasharray="4 3"/>
  <text x="277" y="232" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" letter-spacing="0.8" fill="#82BCA7">AUDITS THE WIKI · DAILY + MONTHLY</text>
  <text x="277" y="254" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="15" font-weight="600" fill="#E7E5DC">Maintain</text>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" letter-spacing="0.8">
    <rect x="372" y="241" width="50" height="17" rx="3" fill="#272A3E" stroke="#A3A7DC"/>
    <text x="397" y="253" text-anchor="middle" fill="#A3A7DC">AGENT</text>
    <rect x="428" y="241" width="42" height="17" rx="3" fill="#21322C" stroke="#82BCA7"/>
    <text x="449" y="253" text-anchor="middle" fill="#82BCA7">CODE</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#9AA093">
    <text x="277" y="274">Report-only lint flags contradictions, stale synthesis,</text>
    <text x="277" y="290">and rubric friction. Fixes route back through the owner.</text>
  </g>

  <!-- loop label -->
  <rect x="290" y="314" width="322" height="16" fill="#141715"/>
  <text x="451" y="326" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#82BCA7">OPEN QUESTIONS SEED TOMORROW'S QUERIES</text>
</svg>
